[workspace]
resolver = "2"
members = [
    "contract/rust",
    "core/cabi",
    "core/ocap",
    "core/crdt",
    "core/runtime",
    "core/identity",
    "core/economy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hash066/Cerberus"

[workspace.dependencies]
# Frozen-contract / crypto / encoding shared across core crates
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
blake3 = "1"
thiserror = "2"
anyhow = "1"
