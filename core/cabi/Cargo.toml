[package]
name = "cerberus-cabi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "C-ABI surface exposing the Rust core to the Go daemon (the FFI keystone)."

[lib]
name = "cerberus_cabi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
cerberus-contract = { path = "../../contract/rust" }
cerberus-ocap = { path = "../ocap" }
# default-features = false drops wasmtime: the cgo staticlib only needs the
# BlockStore, and wasmtime's windows-gnu build needs mingw `dlltool` (absent here).
cerberus-runtime = { path = "../runtime", default-features = false }
cerberus-crdt = { path = "../crdt" }
serde_json = "1"
