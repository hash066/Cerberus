[package]
name = "cerberus-cabi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "C-ABI surface exposing the Rust core to the Go daemon (the FFI keystone)."

[lib]
name = "cerberus_cabi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
cerberus-contract = { path = "../../contract/rust" }
cerberus-ocap = { path = "../ocap" }
# default-features = false drops wasmtime: the cgo staticlib only needs the
# BlockStore, and wasmtime's windows-gnu build needs mingw `dlltool` (absent here).
cerberus-runtime = { path = "../runtime", default-features = false }
cerberus-crdt = { path = "../crdt" }
serde_json = "1"

[features]
# `gpu` forwards to cerberus-runtime/gpu so a cabi built with `--features gpu`
# exports cerberus_gpu_submit backed by the real wgpu device (falling back to the
# software backend when no adapter). OFF by default: the default staticlib keeps
# the software GpuDispatch (real host compute) and never pulls wgpu, so the lean
# windows-gnu cgo build is unchanged.
gpu = ["cerberus-runtime/gpu"]
