<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Cerberus</title>
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand"><span class="logo">🐺</span> Cerberus</div>
      <div class="conn"><span id="conn" class="dot"></span><span id="conn-text">connecting…</span></div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Daemon</h2>
        <div class="kv"><span>Version</span><b id="version">—</b></div>
        <div class="kv"><span>Profile</span><b id="profile">—</b></div>
        <div class="kv"><span>Kernel</span><b id="kernel">—</b></div>
        <div class="kv"><span>Uptime</span><b id="uptime">—</b></div>
      </section>

      <section class="card">
        <h2>Mesh</h2>
        <div class="kv"><span>Fabric</span><b id="mesh">—</b></div>
        <div class="kv"><span>Peers</span><b id="peers">—</b></div>
        <div class="peerlist" id="peerlist">—</div>
      </section>

      <section class="card">
        <h2>Power &amp; Thermal</h2>
        <div class="kv"><span>Source</span><b id="psource">—</b></div>
        <div class="kv"><span>Battery</span><b id="battery">—</b></div>
        <div class="kv"><span>Lid</span><b id="lid">—</b></div>
        <div class="kv"><span>Sleep hint</span><b id="hint">—</b></div>
      </section>

      <section class="card">
        <h2>Economy</h2>
        <div class="kv"><span>Operator balance</span><b id="balance">—</b></div>
        <div class="muted">compute credits (OpenMesh)</div>
      </section>
    </main>

    <footer>
      <span id="err" class="err"></span>
      <span class="muted">auth: operator capability token · status API :7777</span>
    </footer>
  </body>
</html>
