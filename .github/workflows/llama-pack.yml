name: llama-pack

# Verifies the llama.cpp pack Cerberus ships, and proves it actually runs.
#
# WHY THIS NO LONGER BUILDS FROM SOURCE
#   This workflow used to clone llama.cpp at a pinned tag and rebuild it with the
#   Vulkan SDK, because ggml-rpc-server is gated behind -DGGML_RPC=ON at compile
#   time and that was presumed off in upstream's release builds. It is not.
#   Upstream sets it for every job, workflow-wide:
#
#     # ggml-org/llama.cpp .github/workflows/release.yml @ 33a75f41c, line 33:
#     CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF \
#                  -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"
#
#   Every asset pinned in daemon/llama/pack.go was downloaded and inspected: all of
#   them contain ggml-rpc-server alongside llama-server, from one build, which is
#   exactly what the version gate needs (ggml-rpc-server has no --version flag, so
#   its build number is read from the llama-server beside it).
#
#   So Cerberus ships upstream's binaries, and this workflow's job is to VERIFY
#   them rather than to reproduce, bit for bit, an artifact upstream already
#   publishes. The old design also required a human to paste each freshly-built
#   digest into pack.go before FetchPack would work at all; pinning upstream's
#   immutable release assets removes that step entirely.
#
# THE PINNED TAG IS A SECURITY FLOOR
#   daemon/llama refuses to execute any llama.cpp build older than b8492, the fix
#   for CVE-2026-34159 — an unauthenticated pre-auth RCE in the ggml-rpc
#   deserializer (CVSS 9.8). b10021 is well past it. That floor is not
#   configurable; see daemon/llama/version.go.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/llama-pack.yml"
      - "daemon/llama/**"
  # A GitHub release is mutable: assets can be deleted and re-uploaded. If upstream
  # ever re-cuts b10021, every digest compiled into pack.go points at bytes that no
  # longer exist and `cerberus llama fetch` fails closed for everyone. Catch that on
  # a schedule rather than from a user's bug report.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- drift check
  # Re-checks every digest pinned in daemon/llama/pack.go against the live upstream
  # release, and that the tag still resolves to the commit version.go pins.
  digest-drift:
    name: pinned digests still match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check pinned digests against the upstream release
        env:
          CERBERUS_TEST_UPSTREAM: "1"
          # Avoids the 60/hr unauthenticated GitHub API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: go test ./daemon/llama/ -run TestPinnedDigestsMatchUpstream -v -count=1

  # ---------------------------------------------------------------- real smoke
  # Proves the pack we ship runs, on every OS, through the REAL user code path:
  # `cerberus llama fetch` and `cerberus model pull`, not a bespoke CI download. If
  # those commands break, this fails — which is the point.
  #
  # CPU backend deliberately: GitHub runners have no usable GPU, so asserting
  # Vulkan output here would be asserting something the runner cannot do.
  pack-smoke:
    name: real 2-process distributed inference (${{ matrix.os }})
    needs: digest-drift
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The real path a user takes: verifies the compiled-in sha256, extracts, and
      # runs the CVE version gate over the result.
      - name: cerberus llama fetch (CPU pack)
        shell: bash
        run: go run ./cmd/cerberus llama fetch --backend cpu

      - name: cerberus llama status
        shell: bash
        run: go run ./cmd/cerberus llama status

      # stories260K.gguf: llama.cpp's own CI fixture. ~1.1MB, a REAL gguf with real
      # weights and a real tokenizer — small enough to run anywhere, real enough
      # that "it generated tokens" means something. Its digest lives in
      # daemon/llama/registry.go and `model pull` verifies it, so there is exactly
      # ONE place a model digest is written down.
      - name: cerberus model pull stories260k
        shell: bash
        run: go run ./cmd/cerberus model pull stories260k

      - name: Resolve pack + model paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          echo "model=$(go run ./cmd/cerberus model path stories260k)" >> "$GITHUB_OUTPUT"
          echo "pack=$(go run ./cmd/cerberus --json llama status | python3 -c 'import sys,json; print(json.load(sys.stdin)["pack_dir"])')" >> "$GITHUB_OUTPUT"

      # Two REAL processes on one box: ggml-rpc-server on loopback, llama-server
      # driving it over --rpc with a real gguf. Asserts real generated tokens.
      #
      # This exists because the previous inference code's only test skipped itself
      # unless CERBERUS_LLAMA_MODEL was set and CI never set it — which is precisely
      # how a C++ helper that had never once been compiled sat in the tree for
      # months.
      - name: Real distributed generation over ggml-rpc
        shell: bash
        env:
          MODEL: ${{ steps.paths.outputs.model }}
          PACK: ${{ steps.paths.outputs.pack }}
        run: |
          set -euo pipefail
          EXE=""; [ "${{ runner.os }}" = "Windows" ] && EXE=".exe"
          chmod +x "$PACK/llama-server$EXE" "$PACK/ggml-rpc-server$EXE" 2>/dev/null || true

          "$PACK/ggml-rpc-server$EXE" -H 127.0.0.1 -p 50052 -t 2 &
          RPC_PID=$!
          trap 'kill $RPC_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/50052) 2>/dev/null && break
            sleep 0.5
          done

          "$PACK/llama-server$EXE" -m "$MODEL" --host 127.0.0.1 --port 8099 \
            -ngl 99 --rpc 127.0.0.1:50052 &
          SRV_PID=$!
          trap 'kill $RPC_PID $SRV_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8099/health >/dev/null && break
            sleep 0.5
          done

          resp=$(curl -sf http://127.0.0.1:8099/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Once upon a time"}],"max_tokens":24,"temperature":0,"seed":42}')
          echo "$resp"

          content=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin)["choices"][0]["message"]["content"])')
          ctoks=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin)["usage"]["completion_tokens"])')
          echo "generated: $content"
          echo "completion_tokens: $ctoks"
          if [ -z "$content" ] || [ "$ctoks" -lt 1 ]; then
            echo "::error::no real tokens were generated across the two processes"; exit 1
          fi
          echo "REAL distributed generation over ggml-rpc: $ctoks tokens"

      # Greedy determinism, CPU vs CPU ONLY. Vulkan is deliberately NOT asserted
      # bit-exact here: different drivers/hardware legitimately differ, and
      # asserting it would produce a flaky test that gets disabled, which is worse
      # than not asserting it.
      - name: Determinism — single-node CPU vs distributed CPU must match byte-for-byte
        shell: bash
        env:
          MODEL: ${{ steps.paths.outputs.model }}
          PACK: ${{ steps.paths.outputs.pack }}
        run: |
          set -euo pipefail
          EXE=""; [ "${{ runner.os }}" = "Windows" ] && EXE=".exe"
          req='{"messages":[{"role":"user","content":"Once upon a time"}],"max_tokens":24,"temperature":0,"seed":42}'

          "$PACK/llama-server$EXE" -m "$MODEL" --host 127.0.0.1 --port 8098 -ngl 0 &
          A=$!; trap 'kill $A 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8098/health >/dev/null && break; sleep 0.5; done
          single=$(curl -sf http://127.0.0.1:8098/v1/chat/completions -H 'Content-Type: application/json' -d "$req" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["choices"][0]["message"]["content"])')
          kill $A 2>/dev/null || true

          "$PACK/ggml-rpc-server$EXE" -H 127.0.0.1 -p 50053 -t 2 &
          R=$!; trap 'kill $A $R 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/50053) 2>/dev/null && break; sleep 0.5; done
          "$PACK/llama-server$EXE" -m "$MODEL" --host 127.0.0.1 --port 8097 -ngl 99 --rpc 127.0.0.1:50053 &
          B=$!; trap 'kill $A $R $B 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8097/health >/dev/null && break; sleep 0.5; done
          dist=$(curl -sf http://127.0.0.1:8097/v1/chat/completions -H 'Content-Type: application/json' -d "$req" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["choices"][0]["message"]["content"])')

          echo "single-node : $single"
          echo "distributed : $dist"
          if [ "$single" != "$dist" ]; then
            echo "::error::greedy CPU output differs between single-node and distributed-over-loopback — the RPC path is changing results"
            exit 1
          fi
          echo "deterministic: distributing the model did not change the output"
