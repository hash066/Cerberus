name: ci

# Real gates for every push + PR. Mirrors what a developer runs locally
# (see Taskfile.yml `ci` + HANDOFF.md "Build / run / test"):
#   go build/vet/test ./...   cargo build/test/fmt/clippy --workspace
#   go run ./test/e2e         build/ffi.ps1 (Windows cgo kernel binding)
# Plus two security/quality gates installed in-job: golangci-lint, cargo-audit.

on:
  push:
    branches: [main, integration, "ws/**"]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # One run per ref; cancel superseded runs to save CI minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Go control plane
  go:
    name: go build/vet/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build ./...
        run: go build ./...
      - name: go vet ./...
        run: go vet ./...
      - name: go test ./...
        run: go test ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # Advisory gate during the launch push: reports issues but does not fail the
    # run. Promote to a hard gate (remove this line) as part of v3 hardening.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./...

  # ---------------------------------------------------------------- Rust core
  rust:
    name: rust build/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Rust workspace dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        run: cargo test --workspace

  rust-lint:
    name: rust fmt/clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Rust workspace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-audit:
    name: cargo-audit (advisory scan)
    runs-on: ubuntu-latest
    # Advisory: a RustSec advisory in a transitive dep (libp2p/wasmtime/wgpu tree)
    # should surface but not block the launch push. Promote to hard gate in v3.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # Scans Cargo.lock against the RustSec advisory DB. Fails on a known
        # vulnerability; unmaintained/yanked warnings do not fail the build.
        run: cargo audit

  # ---------------------------------------------------------------- 2-node acceptance demo
  e2e:
    name: e2e (2-node remote-WASM -> 1337)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go run ./test/e2e
        run: go run ./test/e2e

  # ---------------------------------------------------------------- cgo: real Rust kernel (-tags ffi)
  ffi-windows:
    name: ffi cgo kernel (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          # GNU-ABI Rust std so the cabi staticlib matches zig's gnu link mode;
          # llvm-tools-preview supplies llvm-ar / llvm-nm for the patch step.
          targets: x86_64-pc-windows-gnu
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (GNU-compatible C compiler for cgo)
        # cgo cannot drive MSVC cl.exe; zig cc provides a portable gcc-compatible
        # C compiler/linker. See docs/ffi.md.
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Point $env:ZIG at zig.exe
        shell: pwsh
        run: |
          $zig = (Get-Command zig).Source
          "ZIG=$zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: build/ffi.ps1 -Action test
        shell: pwsh
        run: pwsh -NoProfile -File build/ffi.ps1 -Action test
