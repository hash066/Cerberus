name: ci

# Real gates for every push + PR. Mirrors what a developer runs locally
# (see Taskfile.yml `ci` + HANDOFF.md "Build / run / test"):
#   go build/vet/test ./...   cargo build/test/fmt/clippy --workspace
#   go run ./test/e2e         build/ffi.ps1 (Windows cgo kernel binding)
# Plus two security/quality gates installed in-job: golangci-lint, cargo-audit.

on:
  push:
    branches: [main, integration, "ws/**"]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # One run per ref; cancel superseded runs to save CI minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Go control plane
  go:
    name: go build/vet/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The default Cerberus build is pure-Go (CGO_ENABLED=0): wazero/bbolt/ed25519,
    # no C toolchain (see HANDOFF.md "Build / run / test" + CLAUDE.md). Pin it here
    # so the hosted Windows runner — which ships gcc and would otherwise default
    # CGO on — builds the SAME artifact developers do. In particular ninep's WinFsp
    # mount then selects cgofuse's no-cgo DLL-loading variant instead of its cgo
    # path, which #includes the WinFsp SDK header (fuse_common.h) that the runner
    # does not have. The real cgo path is covered separately by ffi-windows.
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build ./...
        run: go build ./...
      - name: go vet ./...
        run: go vet ./...
      - name: go test ./...
        run: go test ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # Advisory for now (reports but does not fail the run). Promote to a hard
    # gate — remove continue-on-error — once the reported findings are burned
    # down (Phase 0 follow-up). The linter is BUILT FROM SOURCE with the
    # module's own Go toolchain (setup-go reads go.mod = 1.25.x), so it never
    # hits the "linter built with an older Go than the target module" error that
    # made the pinned golangci-lint-action@v6 binary (go1.24) refuse to run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint (compiled with the module's Go)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: golangci-lint run
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=5m ./..."

  # ---------------------------------------------------------------- Go race detector
  go-race:
    name: go test -race (ubuntu)
    runs-on: ubuntu-latest
    # The race detector needs cgo + a 64-bit target; the default dev build is
    # pure-Go win/386 and cannot run it, so races (like the AcquireLock
    # double-acquire fixed in fa0e9fb's series) can only be caught here. Hard
    # gate: a data race is a bug, not an advisory.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race ./...
        run: go test -race -timeout 20m ./...

  # ---------------------------------------------------------------- Fuzz (untrusted-input decoders)
  fuzz:
    name: fuzz smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz untrusted-input decoders (short active smoke)
        # Every target's SEED corpus already runs in the `go test ./...` matrix
        # above (regression). This adds a short ACTIVE search for shallow
        # crashers — it must run on a 64-bit host because the fuzz engine mmaps a
        # corpus file the pure-Go win/386 dev build cannot. A crash here is a real
        # parser bug on attacker-controlled bytes, so this is a hard gate.
        # (Longer nightly fuzzing is a documented follow-up.)
        run: |
          set -euo pipefail
          go test ./daemon/auth/ -run '^$' -fuzz '^FuzzVerifySignedCap$' -fuzztime=40s
          go test ./daemon/auth/ -run '^$' -fuzz '^FuzzAuthorizeToken$' -fuzztime=40s
          go test ./daemon/mesh/ -run '^$' -fuzz '^FuzzUnmarshalEnvelope$' -fuzztime=40s

  # ---------------------------------------------------------------- Rust core
  rust:
    name: rust build/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Rust workspace dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --workspace
        run: cargo test --workspace

  rust-lint:
    name: rust fmt/clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Rust workspace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-audit:
    name: cargo-audit (advisory scan)
    runs-on: ubuntu-latest
    # Hard gate: as of the wasmtime 37->46 upgrade the tree is advisory-clean
    # (only the allowed `unmaintained: paste` warning remains, which cargo audit
    # does not fail on), so a NEW vulnerability must block rather than warn.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # Scans Cargo.lock against the RustSec advisory DB. Fails on a known
        # vulnerability; unmaintained/yanked warnings do not fail the build.
        run: cargo audit

  # ---------------------------------------------------------------- Supply chain (SBOM)
  sbom:
    name: SBOM (Go + Rust, CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM (scans go.mod + Cargo.lock)
        # Syft discovers both the Go module graph and the Cargo.lock crates in one
        # pass and emits a CycloneDX SBOM (component + license inventory) uploaded
        # as a build artifact. Dependency pinning is already enforced by the
        # committed go.sum + Cargo.lock; hard license-policy enforcement is a
        # documented follow-up (needs an agreed allowlist).
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          artifact-name: sbom.cdx.json

  # ---------------------------------------------------------------- 2-node acceptance demo
  e2e:
    name: e2e (2-node remote-WASM -> 1337)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go run ./test/e2e
        run: go run ./test/e2e

  # ---------------------------------------------------------------- cgo: real Rust kernel (-tags ffi)
  ffi-windows:
    name: ffi cgo kernel (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          # GNU-ABI Rust std so the cabi staticlib matches zig's gnu link mode;
          # llvm-tools-preview supplies llvm-ar / llvm-nm for the patch step.
          targets: x86_64-pc-windows-gnu
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (GNU-compatible C compiler for cgo)
        # cgo cannot drive MSVC cl.exe; zig cc provides a portable gcc-compatible
        # C compiler/linker. See docs/ffi.md.
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Point $env:ZIG at zig.exe
        shell: pwsh
        run: |
          $zig = (Get-Command zig).Source
          "ZIG=$zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: build/ffi.ps1 -Action test
        shell: pwsh
        run: pwsh -NoProfile -File build/ffi.ps1 -Action test
