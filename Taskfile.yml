# Taskfile for Cerberus. Install runner: go install github.com/go-task/task/v3/cmd/task@latest
# Every target also documents the raw command so it can be run without `task`.
# Windows without task: pwsh build/task.ps1 [build|test|lint|demo|ci]
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build Go + Rust (raw: `go build ./...` && `cargo build`)
    cmds:
      - go build ./...
      - cargo build

  build:go:
    desc: "raw: go build ./..."
    cmds:
      - go build ./...

  build:rust:
    desc: "raw: cargo build"
    cmds:
      - cargo build

  build:ffi:
    desc: "Windows: build cerberusd with the real Rust OCap kernel via cgo (raw: pwsh build/ffi.ps1 -Action build). See docs/ffi.md."
    cmds:
      - pwsh -NoProfile -File build/ffi.ps1 -Action build

  test:ffi:
    desc: "Windows: test the cgo capability-kernel binding (raw: pwsh build/ffi.ps1 -Action test). See docs/ffi.md."
    cmds:
      - pwsh -NoProfile -File build/ffi.ps1 -Action test

  build:gpu:
    desc: "Windows+GPU: build cerberusd with the REAL wgpu GPU backend (raw: pwsh build/ffi.ps1 -Action build -Gpu). See docs/gpu.md."
    cmds:
      - pwsh -NoProfile -File build/ffi.ps1 -Action build -Gpu

  test:gpu:
    desc: "Windows+GPU: test the real-GPU cgo path (raw: pwsh build/ffi.ps1 -Action test -Gpu). Reports gpu-wgpu when an adapter is present. See docs/gpu.md."
    cmds:
      - pwsh -NoProfile -File build/ffi.ps1 -Action test -Gpu

  test:
    desc: Unit tests, Go + Rust (raw: `go test ./...` && `cargo test`)
    cmds:
      - go test ./...
      - cargo test

  lint:
    desc: golangci-lint + clippy (best-effort; skips if linters absent)
    cmds:
      - cmd: golangci-lint run ./... || echo "golangci-lint not installed, skipping"
        ignore_error: true
      - cmd: cargo clippy --all-targets || echo "clippy issues / not installed"
        ignore_error: true

  gen:
    desc: Regenerate proto + WIT bindings (raw: go run ./build/gen.go)
    cmds:
      - go run ./build/gen.go

  demo:
    desc: v0.1 acceptance — 2-node mesh + remote WASM exec (raw: go run ./test/e2e)
    cmds:
      - go run ./test/e2e

  ci:
    desc: What CI runs
    cmds:
      - task: build
      - task: test
      - task: lint
